[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "infrawatch"
version = "0.0.1"
description = "Windows and Linux infrastructure monitoring and security platform."
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]


[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.12.0",
    "ruff==0.16.4",
]


[tool.setuptools.packages.find]
include = ["backend*"]


[tool.pytest.ini_options]
testpaths = ["backend/tests"]


[tool.ruff]
target-version = "py313"
line-length = 100


[tool.ruff.lint]
select = ["E", "F", "I", "UP"]